[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "competence-hub-api"
version = "0.1.0"
description = "Internal Competence Hub API foundation"
requires-python = ">=3.11,<3.14"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "cryptography>=49,<50",
    "fastapi>=0.116,<1",
    "pyotp>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "uvicorn>=0.35,<1",
]

[project.scripts]
competence-hub-admin = "competence_hub_api.admin_cli:main"

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
competence_hub_api = ["portal_ui/*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "staging_integration: opt-in tests against isolated PostgreSQL staging",
]
