[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "competence-hub-api"
version = "0.1.0"
description = "Internal Competence Hub API foundation"
requires-python = ">=3.11,<3.14"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
