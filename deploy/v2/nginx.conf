pid /run/competence-hub-v2-proxy/nginx.pid;
error_log stderr crit;
worker_processes 1;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /run/competence-hub-v2-proxy/body;
    proxy_temp_path /run/competence-hub-v2-proxy/proxy;
    fastcgi_temp_path /run/competence-hub-v2-proxy/fastcgi;
    uwsgi_temp_path /run/competence-hub-v2-proxy/uwsgi;
    scgi_temp_path /run/competence-hub-v2-proxy/scgi;
    server {
        listen 127.0.0.1:8444 ssl;
        server_name localhost;
        server_tokens off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /opt/competence-hub-pilot/pilot.crt;
        ssl_certificate_key /run/credentials/competence-hub-v2-proxy.service/tls.key;
        client_max_body_size 32k;
        if ($http_host != "localhost:8447") { return 421; }
        location / {
            proxy_pass http://127.0.0.1:8002;
            proxy_set_header Host localhost:8447;
            proxy_set_header X-Forwarded-Host localhost:8447;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
